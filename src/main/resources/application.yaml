server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      # 强制响应也带上 charset
      # 不设的话响应头是 application/json（无 charset），而 PowerShell 5.1 这类
      # 老客户端会退回 Latin-1 解码 -> 中文全变乱码（应用本身是对的，是客户端误会）
      force: true

spring:
  application:
    name: hotel-booking

  # 数据库在服务器 <your-server> 的 mysql 容器里
  #   远端 127.0.0.1:3306  ->  SSH 隧道  ->  本地 127.0.0.1:13306
  # 隧道断了应用就连不上库（重启应用即可恢复）
  #
  # 凭据一律用 ${环境变量:默认值} 占位：
  #   默认值只是"本地隧道 + 开发库"的方便默认，不是秘密；
  #   真实环境用环境变量注入，不把密码写进版本库。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:13306}/${DB_NAME:hotel_booking}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:dzkjdx}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  # Redis（P1 起）：区间库存缓存 + 幂等
  #   远端 127.0.0.1:6379  ->  SSH 隧道  ->  本地 127.0.0.1:16379
  #
  # ★ 这里放的全部是【派生数据】（可从 DB 重建），
  #   所以即使服务器 Redis 配的是 allkeys-lru 把键淘汰掉也不影响正确性 ——
  #   最多是一次 cache miss，回源 DB 即可。DB 才是裁决者。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:dzkjdx}
      timeout: 3000ms
      connect-timeout: 3000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # P0 调试期打开 SQL 日志，方便观察"逐天条件 UPDATE"
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      # 全局逻辑删除：实体里名叫 isDeleted 的字段自动生效（hotel/room_type/booking/sys_user）
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# 业务配置
hotel:
  booking:
    # 待支付超时时间。P2 起由 Redis 延迟队列按这个时长精确触发释放。
    pay-timeout-minutes: 15
    # 区间库存缓存的 TTL（秒）。缓存是可重建的派生数据，给个 TTL 只是做卫生。
    inventory-cache-ttl-seconds: 86400
    # P3.3：TTL 抖动上限（秒）。实际 TTL = 基础值 + random(0, 抖动)。
    # 缓存是懒加载的，"同一段时间创建的一批 key"会同时过期 —— 加抖动把它们摊开，
    # 避免到点一起失效把请求同时压到 DB 上（缓存雪崩）。
    inventory-cache-ttl-jitter-seconds: 3600

    # P2：订单超时处理的两条路径
    delay:
      # 主路径：消费 Redis 延迟队列的频率。1 秒 = 超时释放的精度是秒级。
      scan-interval-ms: 1000
      # 每次最多认领多少个到期任务
      batch-size: 50
      # 兜底路径：扫表。跑得慢无所谓，它的意义是"队列丢了任务也能补上"。
      sweep-interval-ms: 300000

  # P2.2：附近酒店（Redis GEO）
  nearby:
    default-radius-km: 5
    default-limit: 20
    # 启动时从 DB 重建 GEO 索引。
    # 索引是可重建的派生数据，但"空索引"会让附近查询静默返回空列表 ——
    # 与其让调用方困惑，不如启动时就建好（5 家酒店，几十毫秒）。
    rebuild-on-startup: true

  # P2.4：定期清理（两类"会无限增长 / 会悄悄残留"的数据）
  maintenance:
    # 幂等记录：过期的就没用了（幂等窗口只有 600 秒），每天凌晨 3:30 清一次
    idempotent-clean-cron: "0 30 3 * * ?"
    idempotent-batch: 5000
    # 延迟队列：正常路径在订单终态时已删掉自己，这里只是兜底，每 30 分钟扫一次
    delay-purge-cron: "0 */30 * * * ?"
    delay-purge-batch: 1000

  # P3.2：分布式锁（只用于"回源单飞"，不是业务互斥锁）
  lock:
    # 锁的保命 TTL（秒）。持有者挂了也不会永不过期，到点自动放。
    inv-load-ttl-seconds: 5
    # 没抢到锁时最多等几轮、每轮多久。
    # 每轮都会先看"持有者写完了没"，写完就立刻走，所以这只是**上限**而不是固定开销。
    # 40 × 50ms = 2s：够慢速 DB 填完，又不至于让请求卡太久。
    inv-load-wait-rounds: 40
    inv-load-wait-interval-ms: 50

  # P3.1：防缓存穿透
  cache:
    # 「这个 id 不存在」的记忆时长（秒）。
    # 刻意很短：万一数据后来真的被创建了，最多 60 秒就自愈，不用人工清缓存。
    absent-ttl-seconds: 60

logging:
  level:
    com.fancy.hotel: debug
